# Crea un release con el script descargable al publicar una etiqueta vX.Y.Z.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: npm test

      - name: Preparar archivos
        run: |
          mkdir dist
          cp AutoSort-Gangsheet.jsx dist/
          cp README.md LICENSE dist/
          (cd dist && zip -q "AutoSort-Gangsheet-${GITHUB_REF_NAME}.zip" AutoSort-Gangsheet.jsx README.md LICENSE)

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AutoSort Gangsheet DTF $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            dist/AutoSort-Gangsheet.jsx \
            "dist/AutoSort-Gangsheet-${GITHUB_REF_NAME}.zip"
